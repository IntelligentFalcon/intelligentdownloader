name: Generate Files for Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.8.9, 1.21.11)'
        required: true
        type: string
        default: '1.8.9'

jobs:
  generate-version-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git for large pushes
      run: |
        git config --global http.postBuffer 524288000
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999
    
    - name: Set up Git LFS
      run: |
        git lfs install
        git lfs track "*.jar"
        git lfs track "*.exe"
        git lfs track "*.dll"
        git lfs track "*.bin"
        git add .gitattributes
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Python script with version argument
      run: |
        python main.py --version "${{ github.event.inputs.version }}"
    
    - name: Create new branch
      run: |
        BRANCH_NAME="version/${{ github.event.inputs.version }}"
        git checkout -b "$BRANCH_NAME"
        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
    
    - name: Add generated files with LFS
      run: |
        git add .
        git status
    
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if ! git diff --cached --quiet; then
          git commit -m "Add generated files for version ${{ github.event.inputs.version }}"
        else
          echo "No changes to commit"
        fi
    
    - name: Push new branch with LFS
      run: |
        git push origin "${{ env.BRANCH_NAME }}"
